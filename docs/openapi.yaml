openapi: 3.0.3
info:
  title: FreelanceTracker API
  description: |
    REST API for managing freelance clients, projects, timesheets, and invoices.

    ## Authentication

    All API endpoints (except `/auth/login`) require authentication using an API key.
    Include your API key in the `Authorization` header:

    ```
    Authorization: Bearer ftk_your_api_key_here
    ```

    ## Scopes

    API keys have different scopes that control access:
    - `*` - Full admin access to all resources
    - `clients:read` - Read client data
    - `clients:write` - Create/update/delete clients
    - `projects:read` - Read project data
    - `projects:write` - Create/update/delete projects
    - `timesheets:read` - Read timesheet data
    - `timesheets:write` - Create/update/delete timesheets
    - `invoices:read` - Read invoice data
    - `invoices:write` - Create/update/delete invoices
    - `reports:read` - Access reports
    - `settings:read` - Read settings
    - `settings:write` - Update settings
    - `apikeys:read` - List API keys
    - `apikeys:write` - Create/delete API keys

    Resource wildcards are supported (e.g., `clients:*` grants all client operations).

  version: 1.0.0
  contact:
    name: API Support
    email: support@freelancetracker.com

servers:
  - url: https://api.freelancetracker.com/api/v1
    description: Production server
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: Login and API key management
  - name: Clients
    description: Client management operations
  - name: Projects
    description: Project management operations
  - name: Timesheets
    description: Timesheet tracking operations
  - name: Invoices
    description: Invoice generation and management
  - name: Reports
    description: Financial reporting
  - name: Settings
    description: Application settings management

security:
  - BearerAuth: []

paths:
  # ==========================================
  # Authentication Endpoints
  # ==========================================

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      description: Authenticate with credentials to receive an API key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: your_password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: ftk_abc123def456ghi789
                  message:
                    type: string
                    example: Login successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/apikeys:
    get:
      tags: [Authentication]
      summary: List all API keys
      description: Retrieve list of API keys for the authenticated user
      security:
        - BearerAuth: [apikeys:read]
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Authentication]
      summary: Create a new API key
      description: Generate a new API key with specified scopes
      security:
        - BearerAuth: [apikeys:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  example: Production App Key
                scopes:
                  type: string
                  example: clients:* projects:read invoices:write
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: ftk_xyz789abc456def123
                  message:
                    type: string
                    example: API key created successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/apikeys/{id}:
    delete:
      tags: [Authentication]
      summary: Delete an API key
      description: Revoke an API key by ID
      security:
        - BearerAuth: [apikeys:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: API key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # Client Endpoints
  # ==========================================

  /clients:
    get:
      tags: [Clients]
      summary: List all clients
      description: Retrieve a paginated list of clients with optional search
      security:
        - BearerAuth: [clients:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Clients]
      summary: Create a new client
      description: Add a new client to the system
      security:
        - BearerAuth: [clients:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get client by ID
      description: Retrieve detailed information about a specific client
      security:
        - BearerAuth: [clients:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Clients]
      summary: Update a client
      description: Update client information
      security:
        - BearerAuth: [clients:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Clients]
      summary: Delete a client
      description: Soft delete a client (mark as deleted)
      security:
        - BearerAuth: [clients:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Client deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{id}/projects:
    get:
      tags: [Clients]
      summary: Get client's projects
      description: Retrieve all projects for a specific client
      security:
        - BearerAuth: [clients:read, projects:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{id}/hourlyrate:
    get:
      tags: [Clients]
      summary: Get client hourly rate
      description: Retrieve the hourly rate for a specific client
      security:
        - BearerAuth: [clients:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Client hourly rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  hourlyRate:
                    type: number
                    format: double
                    example: 150.00
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # Project Endpoints
  # ==========================================

  /projects:
    get:
      tags: [Projects]
      summary: List all projects
      description: Retrieve a paginated list of projects with optional search
      security:
        - BearerAuth: [projects:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          description: Filter by project status
          schema:
            type: string
            enum: [Estimating, active, on hold, completed, cancelled]
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Projects]
      summary: Create a new project
      description: Add a new project to the system
      security:
        - BearerAuth: [projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      description: Retrieve detailed information about a specific project
      security:
        - BearerAuth: [projects:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Projects]
      summary: Update a project
      description: Update project information
      security:
        - BearerAuth: [projects:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Projects]
      summary: Delete a project
      description: Soft delete a project (mark as deleted)
      security:
        - BearerAuth: [projects:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/status:
    patch:
      tags: [Projects]
      summary: Update project status
      description: Update only the status field of a project
      security:
        - BearerAuth: [projects:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Estimating, active, on hold, completed, cancelled]
                  example: completed
      responses:
        '200':
          description: Project status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: completed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{id}/timesheets:
    get:
      tags: [Projects]
      summary: Get project timesheets
      description: Retrieve all timesheets for a specific project
      security:
        - BearerAuth: [projects:read, timesheets:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of timesheets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Timesheets]
      summary: Create timesheet for project
      description: Add a new timesheet entry to a project
      security:
        - BearerAuth: [timesheets:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetRequest'
      responses:
        '201':
          description: Timesheet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{id}/invoices:
    get:
      tags: [Projects]
      summary: Get project invoices
      description: Retrieve all invoices for a specific project
      security:
        - BearerAuth: [projects:read, invoices:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Invoices]
      summary: Create invoice for project
      description: Generate a new invoice for a project
      security:
        - BearerAuth: [invoices:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================
  # Timesheet Endpoints
  # ==========================================

  /timesheets/{id}:
    get:
      tags: [Timesheets]
      summary: Get timesheet by ID
      description: Retrieve detailed information about a specific timesheet
      security:
        - BearerAuth: [timesheets:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Timesheet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Timesheets]
      summary: Update a timesheet
      description: Update timesheet information
      security:
        - BearerAuth: [timesheets:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetRequest'
      responses:
        '200':
          description: Timesheet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Timesheets]
      summary: Delete a timesheet
      description: Soft delete a timesheet (mark as deleted)
      security:
        - BearerAuth: [timesheets:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Timesheet deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # Invoice Endpoints
  # ==========================================

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice by ID
      description: Retrieve detailed information about a specific invoice
      security:
        - BearerAuth: [invoices:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Invoices]
      summary: Update an invoice
      description: Update invoice information (e.g., mark as paid)
      security:
        - BearerAuth: [invoices:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '200':
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Invoices]
      summary: Delete an invoice
      description: Soft delete an invoice (mark as deleted)
      security:
        - BearerAuth: [invoices:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Invoice deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Generate invoice PDF
      description: Generate and download a PDF version of the invoice
      security:
        - BearerAuth: [invoices:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoices/{id}/email:
    post:
      tags: [Invoices]
      summary: Email invoice
      description: Send invoice PDF via email to the client
      security:
        - BearerAuth: [invoices:write]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  format: email
                  example: client@example.com
                subject:
                  type: string
                  example: Invoice for Project XYZ
                body:
                  type: string
                  example: Please find attached the invoice for your recent project.
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==========================================
  # Report Endpoints
  # ==========================================

  /reports/income:
    get:
      tags: [Reports]
      summary: Get income report
      description: Retrieve monthly income breakdown for a specific year
      security:
        - BearerAuth: [reports:read]
      parameters:
        - name: year
          in: query
          required: true
          description: Year for the income report (1900-2100)
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            example: 2024
      responses:
        '200':
          description: Income report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # Settings Endpoints
  # ==========================================

  /settings:
    get:
      tags: [Settings]
      summary: Get all settings
      description: Retrieve all application settings
      security:
        - BearerAuth: [settings:read]
      responses:
        '200':
          description: All settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                example:
                  default_hourly_rate: "85.00"
                  invoice_title: "Invoice for Academic Editing"
                  freelancer_name: "Your Name"
                  email_enabled: "false"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [Settings]
      summary: Update multiple settings
      description: Update one or more settings at once
      security:
        - BearerAuth: [settings:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    default_hourly_rate: "95.00"
                    freelancer_name: "John Doe"
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/{key}:
    get:
      tags: [Settings]
      summary: Get a setting by key
      description: Retrieve a single setting value
      security:
        - BearerAuth: [settings:read]
      parameters:
        - name: key
          in: path
          required: true
          description: Setting key
          schema:
            type: string
            example: default_hourly_rate
      responses:
        '200':
          description: Setting value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: default_hourly_rate
                  value:
                    type: string
                    example: "85.00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Settings]
      summary: Update a single setting
      description: Update one setting by key
      security:
        - BearerAuth: [settings:write]
      parameters:
        - name: key
          in: path
          required: true
          description: Setting key
          schema:
            type: string
            example: default_hourly_rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  example: "95.00"
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

# ==========================================
# Components
# ==========================================

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'API key in format: ftk_xxxxxxxxxxxxx'

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        example: 1

    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PageSize:
      name: pageSize
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    Search:
      name: search
      in: query
      description: Search term to filter results
      schema:
        type: string
        example: Acme

  schemas:
    # ==========================================
    # Client Schemas
    # ==========================================

    ClientRequest:
      type: object
      required: [name, email, hourlyRate]
      properties:
        name:
          type: string
          minLength: 1
          example: Acme Corporation
        email:
          type: string
          format: email
          example: billing@acme.com
        phone:
          type: string
          nullable: true
          example: "555-1234"
        address1:
          type: string
          nullable: true
          example: "123 Main Street"
        address2:
          type: string
          nullable: true
          example: "Suite 100"
        address3:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          example: "San Francisco"
        state:
          type: string
          nullable: true
          example: "CA"
        zipCode:
          type: string
          nullable: true
          example: "94105"
        hourlyRate:
          type: number
          format: double
          minimum: 0
          example: 150.00
        notes:
          type: string
          nullable: true
          example: "Primary contact: John Doe"
        additionalInfo:
          type: string
          nullable: true
        additionalInfo2:
          type: string
          nullable: true
        billTo:
          type: string
          nullable: true
        includeAddressOnInvoice:
          type: boolean
          default: true
        invoiceCCEmail:
          type: string
          format: email
          nullable: true
        invoiceCCDescription:
          type: string
          nullable: true
        universityAffiliation:
          type: string
          nullable: true

    ClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRequest'
        - type: object
          required: [id, created, updated]
          properties:
            id:
              type: integer
              example: 1
            created:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"
            updated:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"

    ClientListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ==========================================
    # Project Schemas
    # ==========================================

    ProjectRequest:
      type: object
      required: [name, clientId, status, hourlyRate]
      properties:
        name:
          type: string
          minLength: 1
          example: Website Redesign
        clientId:
          type: integer
          example: 1
        status:
          type: string
          enum: [Estimating, active, on hold, completed, cancelled]
          example: active
        hourlyRate:
          type: number
          format: double
          minimum: 0
          example: 150.00
        deadline:
          type: string
          format: date
          nullable: true
          example: "2024-12-31"
        notes:
          type: string
          nullable: true
          example: "Modernize company website"

    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/ProjectRequest'
        - type: object
          required: [id, created, updated]
          properties:
            id:
              type: integer
              example: 1
            created:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"
            updated:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ==========================================
    # Timesheet Schemas
    # ==========================================

    TimesheetRequest:
      type: object
      required: [workDate, hoursWorked, hourlyRate]
      properties:
        workDate:
          type: string
          format: date
          example: "2024-01-15"
        hoursWorked:
          type: number
          format: double
          minimum: 0
          example: 8.0
        hourlyRate:
          type: number
          format: double
          minimum: 0
          example: 150.00
        description:
          type: string
          nullable: true
          example: "Frontend development - homepage"

    TimesheetResponse:
      allOf:
        - $ref: '#/components/schemas/TimesheetRequest'
        - type: object
          required: [id, projectId, created, updated]
          properties:
            id:
              type: integer
              example: 1
            projectId:
              type: integer
              example: 1
            created:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"
            updated:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00Z"

    TimesheetListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetResponse'

    # ==========================================
    # Invoice Schemas
    # ==========================================

    InvoiceRequest:
      type: object
      required: [invoiceDate, paymentTerms, amountDue, displayDetails]
      properties:
        invoiceDate:
          type: string
          format: date
          example: "2024-01-31"
        datePaid:
          type: string
          format: date
          nullable: true
          example: "2024-02-28"
        paymentTerms:
          type: string
          example: "Net 30"
        amountDue:
          type: number
          format: double
          minimum: 0
          example: 7575.00
        displayDetails:
          type: boolean
          description: Whether to show timesheet details on the invoice
          example: true

    InvoiceResponse:
      allOf:
        - $ref: '#/components/schemas/InvoiceRequest'
        - type: object
          required: [id, projectId, created, updated]
          properties:
            id:
              type: integer
              example: 1
            invoiceNum:
              type: integer
              nullable: true
              example: 1001
            projectId:
              type: integer
              example: 1
            created:
              type: string
              format: date-time
              example: "2024-01-31T10:30:00Z"
            updated:
              type: string
              format: date-time
              example: "2024-01-31T10:30:00Z"

    InvoiceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResponse'

    # ==========================================
    # Report Schemas
    # ==========================================

    IncomeReportResponse:
      type: object
      required: [year, total, months]
      properties:
        year:
          type: integer
          example: 2024
        total:
          type: number
          format: double
          example: 125000.00
        months:
          type: array
          items:
            type: object
            required: [month, amount]
            properties:
              month:
                type: integer
                minimum: 1
                maximum: 12
                example: 1
              amount:
                type: number
                format: double
                example: 10000.00

    # ==========================================
    # API Key Schemas
    # ==========================================

    APIKeyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "Production App Key"
              keyPrefix:
                type: string
                example: "ftk_abc"
              scopes:
                type: string
                example: "clients:* projects:read"
              lastUsedAt:
                type: string
                format: date-time
                nullable: true
                example: "2024-01-15T10:30:00Z"
              created:
                type: string
                format: date-time
                example: "2024-01-01T08:00:00Z"

    # ==========================================
    # Common Schemas
    # ==========================================

    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 150

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Validation failed"
            details:
              type: object
              nullable: true
              additionalProperties:
                type: string
              example:
                name: "Name is required"
                email: "Invalid email format"

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "BAD_REQUEST"
              message: "Invalid request format"

    Unauthorized:
      description: Unauthorized - missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Invalid or missing API key"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "FORBIDDEN"
              message: "Required scopes: clients:write"

    NotFound:
      description: Not found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "NOT_FOUND"
              message: "Resource not found"

    ValidationError:
      description: Unprocessable entity - validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Validation failed"
              details:
                email: "Invalid email format"
                hourlyRate: "Must be greater than 0"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "An internal error occurred"
