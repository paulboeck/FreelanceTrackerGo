{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{template "title" .}} - Freelance Tracker</title>
    <!-- Link to the CSS stylesheet and favicon -->
    <link rel='stylesheet' href='/static/css/main.css'>
    <link rel='shortcut icon' href='/static/img/favicon.ico' type='image/x-icon'>
    <!-- Also link to some fonts hosted by Google -->
    <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap'>
</head>
<body>
    <div class="header-nav-container">
        <header>
            <h1><a href='/'><img src='/static/img/logo.svg' alt='Freelance Tracker Logo' class='logo'> Freelance Tracker</a></h1>
        </header>
        <!-- Invoke the navigation template -->
        {{template "nav" .}}
    </div>
    <main>
        <!-- Display the flash message if one exists -->
        {{with .Flash}}
            <div class='flash'>{{.}}</div>
        {{end}}
        {{template "main" .}}
    </main>
    <footer>Copyright &copy; {{.CurrentYear}} </footer>
    <!-- And include the JavaScript file -->
    <script src='/static/js/main.js' type='text/javascript'></script>
</body>
</html>
{{end}}
