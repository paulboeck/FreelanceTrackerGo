{{define "title"}}Home{{end}}
{{define "main"}}
    <div class="list-header">
        <h3>Latest Clients</h3>
        <a href="/client/create" class="btn-add" title="Add new client">
            ➕ Add Client
        </a>
    </div>
    <div class="search-form">
        <form method="GET" action="/">
            <div class="search-container">
                <input 
                    type="text" 
                    name="search" 
                    id="clientSearch"
                    value="{{.SearchTerm}}" 
                    placeholder="Search clients by name or email..." 
                    class="search-input"
                />
                <button 
                    type="button" 
                    class="btn-icon btn-clear"
                    title="Clear search"
                >
                    ✕
                </button>
            </div>
        </form>
    </div>
    {{if .Clients}}
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
            {{range .Clients}}
                <tr>
                    <td>{{.ID}}</td>
                    <td><a href="client/view/{{.ID}}">{{.Name}}</a></td>
                    <td>{{humanDate .Created}}</td>
                    <td>
                        <div class="action-buttons">
                            <a href="/client/update/{{.ID}}" class="btn-icon btn-edit" title="Edit client">
                                ✏️
                            </a>
                            <form method="POST" action="/client/delete/{{.ID}}">
                                <button type="submit" class="btn-icon btn-delete" title="Delete client">
                                    🗑️
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            {{end}}
        </table>
        {{template "pagination" .}}
    {{else}}
        <p>There's nothing to see here... yet!</p>
    {{end}}
{{end}}
