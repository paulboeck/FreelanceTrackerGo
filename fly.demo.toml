# fly.toml app configuration file for demo instance
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'freelance-tracker-demo'
primary_region = 'ord'

[build]

[[mounts]]
  source = 'freelance_demo_data'
  destination = '/data'
  initial_size = '512mb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
