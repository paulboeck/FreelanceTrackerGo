name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify dependencies
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Generate code with sqlc
      run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate

    - name: Install Chrome for e2e tests
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Verify Chrome installation
      run: |
        which google-chrome || which chromium || which chrome || echo "Chrome not found in PATH"
        google-chrome --version || chromium --version || chrome --version || echo "Could not get Chrome version"

    - name: Run tests
      run: go test -v -race -short -timeout=20m -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Clean up test artifacts
      if: always()
      run: |
        find . -name "test_*.db" -type f -delete
        pkill -f "web -addr" || true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Generate code with sqlc
      run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate

    - name: Build
      run: |
        VERSION=$(git describe --tags --always --dirty)
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" -o bin/web ./cmd/web

    - name: Verify build artifact
      run: |
        ls -lh bin/web
        file bin/web

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Generate code with sqlc
      run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m
      continue-on-error: true

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: freelance-tracker:test
        build-args: |
          VERSION=${{ github.sha }}
          BUILD_TIME=${{ github.event.head_commit.timestamp }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
