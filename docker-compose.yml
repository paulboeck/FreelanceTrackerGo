version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: freelance-tracker:latest
    container_name: freelance-tracker-web
    ports:
      - "8080:8080"
    volumes:
      # Persist database outside container
      - ./data:/data
    environment:
      - ADDR=:8080
      - DSN=/data/freelance_tracker.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
    driver: local
